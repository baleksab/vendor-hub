  "@types/react-dom": 19.3.0
  "@types/node": 24.19.2
  vite: 8.3.5
  vitest: 5.1.0
  "@vitejs/plugin-react": 6.1.2
  "@mantine/core": 9.7.4
  "@mantine/hooks": 9.7.4
  "@mantine/form": 9.7.4
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@module-federation/vite": 1.23.7
  "@module-federation/runtime": 2.9.2
  typescript: 7.0.2
  oxfmt: 0.75.0
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  husky: 9.1.7
  lint-staged: 17.6.0
  fastify: 5.12.8
  fastify-type-provider-zod: 7.0.0
  zod: 4.6.7
  "@fastify/swagger": 9.9.3
  openapi-types: 12.1.3
  openapi-typescript: 7.13.0
  "@fastify/swagger-ui": 6.1.3
  "@fastify/multipart": 10.1.8
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
