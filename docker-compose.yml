name: vendor-hub

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      NGINX_PORT: ${NGINX_PORT:?}
      VENDOR_BASE_DOMAIN: ${VENDOR_BASE_DOMAIN:?}
      SHELL_UPSTREAM: ${SHELL_UPSTREAM:?}
      MAIN_SITE_ORIGIN: ${MAIN_SITE_ORIGIN:?}
      VENDOR_SLUG_HEADER: ${VENDOR_SLUG_HEADER:?}
    ports:
      - "${NGINX_PORT:?}:${NGINX_PORT:?}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/nginx/vendorhub.conf.template:/etc/nginx/templates/vendorhub.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${NGINX_PORT}/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
