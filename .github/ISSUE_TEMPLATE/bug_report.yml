name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - shell
        - remotes
        - server
        - types
        - api-client
        - ui
        - user-administrator
        - vendor-administrator
        - infra
        - root / tooling
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pnpm dev
        2. Open ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node, pnpm, OS, browser
      placeholder: Node 24.x, pnpm 12.x, macOS, Chrome
